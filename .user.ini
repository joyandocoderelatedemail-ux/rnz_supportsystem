; Raises the upload ceiling for ticket chat attachments (video, PDF, Excel)
; above PHP's very small defaults. Only takes effect on PHP-FPM / CGI hosts,
; which read .user.ini automatically - it is silently ignored under Apache's
; mod_php (including local XAMPP), where php.ini itself must be edited instead.
upload_max_filesize = 55M
post_max_size = 65M
